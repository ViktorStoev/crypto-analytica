name: CI

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master
      - "feature/**"
      - "test/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI environment
        run: cp .env.exaple .env

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q app scripts tests

      - name: Run tests
        run: pytest -q

  container:
    name: Validate containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI environment
        run: cp .env.example .env

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build containers
        run: docker compose build app telegram_gateway
