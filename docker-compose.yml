name: crypto-market-mvp

services:
  timescaledb:
    image: timescale/timescaledb:2.27.0-pg16-oss
    container_name: crypto_timescaledb
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

    environment:
      TZ: UTC
      PGTZ: UTC

    command: >
      postgres
      -c shared_preload_libraries=timescaledb
      -c timezone=UTC
      -c log_timezone=UTC
      -c max_connections=50
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crypto_pgadmin
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      timescaledb:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: crypto_app
    restart: "no"

    env_file:
      - .env

    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      BYBIT_BASE_URL: https://api.bybit.com
      PYTHONPATH: /app

      TELEGRAM_PROXY_URL: http://tailscale:8080


    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts

    depends_on:
      timescaledb:
        condition: service_healthy
      telegram_gateway:
        condition: service_started
  

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: crypto_scheduler
    restart: unless-stopped

    command:
      - python
      - scripts/run_scheduler.py

    env_file:
      - .env

    environment:
      PYTHONPATH: /app
      DB_HOST: timescaledb
      DB_PORT: 5432
      BYBIT_BASE_URL: https://api.bybit.com

      SCHEDULER_SYMBOL: BTCUSDT
      SCHEDULER_INTERVAL: "60"
      SCHEDULER_CRON_HOURS: "0,4,8,12,16,20"
      SCHEDULER_CRON_MINUTE: "5"
      SCHEDULER_TIMEZONE: UTC
      SCHEDULER_NOTIFY: "false"
      SCHEDULER_LOG_LEVEL: INFO

      TELEGRAM_PROXY_URL: http://tailscale:8080

    depends_on:
      timescaledb:
        condition: service_healthy
      telegram_gateway:
        condition: service_started

    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts

    networks:
      - default

  tailscale:
    image: tailscale/tailscale:stable
    container_name: crypto_tailscale
    restart: unless-stopped

    hostname: crypto-analytica-tailscale

    environment:
      TS_AUTHKEY: ${TAILSCALE_AUTHKEY}
      TS_HOSTNAME: crypto-analytica-tailscale
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"

      # Userspace mode is more reliable in Docker Desktop.
      TS_USERSPACE: "true"

      # Keep this proxy private inside the tailscale network namespace.
      # Only telegram_gateway can reach it via 127.0.0.1 because it shares
      # network_mode: service:tailscale.
      TS_SOCKS5_SERVER: "127.0.0.1:1055"

      TS_ACCEPT_DNS: "true"
      TS_EXTRA_ARGS: "--exit-node=${TAILSCALE_EXIT_NODE} --exit-node-allow-lan-access"

      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: "0.0.0.0:9002"

    volumes:
      - tailscale_state:/var/lib/tailscale

    expose:
      - "9002"

    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s


  telegram_gateway:
    build:
      context: ./docker/telegram-gateway
      dockerfile: Dockerfile

    container_name: crypto_telegram_gateway
    restart: unless-stopped

    network_mode: service:tailscale

    environment:
      TELEGRAM_GATEWAY_HOST: "0.0.0.0"
      TELEGRAM_GATEWAY_PORT: "8080"
      TELEGRAM_GATEWAY_ALLOWED_HOST: "api.telegram.org"
      TELEGRAM_GATEWAY_ALLOWED_PORT: "443"

      # Private upstream SOCKS5 proxy from tailscale userspace mode.
      TELEGRAM_GATEWAY_UPSTREAM_SOCKS5_HOST: "127.0.0.1"
      TELEGRAM_GATEWAY_UPSTREAM_SOCKS5_PORT: "1055"

    depends_on:
      tailscale:
        condition: service_healthy

        
volumes:
  timescaledb_data:
  pgadmin_data:
  tailscale_state: